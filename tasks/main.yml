---
- name: Set platform/version specific variables
  include_tasks: tasks/set_vars.yml

# Examples of some tasks:
- name: Ensure required packages are installed
  package:
    name: "{{ __ci_testing_packages }}"
    state: present
    use: "{{ (__ci_testing_is_ostree | d(false)) |
             ternary('ansible.posix.rhel_rpm_ostree', omit) }}"

- name: Ensure required services are enabled and started
  service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ __ci_testing_services }}"

- name: Generate /etc/{{ __ci_testing_foo_config }}
  template:
    src: "{{ __ci_testing_foo_config }}.j2"
    dest: /etc/{{ __ci_testing_foo_config }}
    backup: true
    mode: "0400"
  notify: Handler for ci-testing to restart services

- name: Record role success fingerprint
  sr_fingerprint:
    status: success
    role_name: template
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __ci_testing_write_log_file }}"
